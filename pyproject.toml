[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mozaic-daily"
version = "0.1.0"
description = "Automated daily forecasting for Mozilla Firefox metrics"
requires-python = ">=3.10"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
# _archive/ holds code deliberately frozen against past forecast cycles (see _archive/_index.md).
# Its tests exercise the frozen 2026-06 seam-MA copy, not the package, so they must not run as
# part of the live suite -- collecting them would report on code that is not allowed to change.
# Run them explicitly by path if you want to confirm frozen behaviour still holds.
norecursedirs = ["_archive", ".venv", "data-official", "build", "dist"]
