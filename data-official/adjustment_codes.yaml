# Registry of adjustment codes used in forecast file naming.
#
# Every forecast artifact (parquet/CSV) carries a state marker:
#   .raw.           = no adjustments applied
#   .adj-{codes}.   = one or more adjustments applied; codes are sorted
#                     alphabetically and concatenated (e.g. .adj-h., .adj-ht.)
#
# Adding a new adjustment:
#   1. Add a one-letter code below with name + applier + description + spec_glob.
#   2. `applier` selects the machinery and is load-bearing (`spec_glob` may be one pattern or a
#      list; the first is the current layout, later ones are legacy layouts):
#        display_layer      — spec in data-official/*/adjustments/, summed onto the
#                             28d MA after mozaic (`h`, `t`). No Python needed.
#        per_tile_overlay   — a `desktop_overlay` spec + curve parquet, subtracted
#                             from training rows and added back after mozaic (`l`,
#                             `o`). Dispatched from this file by
#                             src/mozaic_daily/overlays.py: `spec_glob` is where it
#                             looks, and the spec's `applies_to_forecast_start` /
#                             `applies_to_data_source` gate it. No Python needed.
#        marketing_lift     — the retired `m` path, kept so old artifacts reproduce.
#        paid_organic_split — the mobile `p` path (organic.py).
#      Only a genuinely new mechanism needs code in src/mozaic_daily/.
#   3. Update tests/test_adjustments.py (and tests/test_overlays.py for a
#      per_tile_overlay) to cover the new code.
#
# Codes must be single lowercase letters, unique. The combined .adj- portion of
# a filename is generated by sorting codes alphabetically (so "h" + "t" -> "ht",
# never "th") — this guarantees one canonical filename per state.

codes:
  h:
    name: headwinds
    applier: display_layer
    description: >
      The Win10 desktop headwind: DAU pressure from the Windows 10 end-of-support
      cohort, applied at the display layer (summed onto the 28d MA after mozaic, so
      its Dec-15 effect is exact and needs no rerun). Per-cycle spec at
      data-official/{YYYY-MM}/adjustments/headwind.json: a two-number linear_ramp from
      0 at the cycle's seam to the anchor at Dec-15. Through 2026-08 the anchor was
      -1,315,000 (with mobile -27,162 in the same file). For 2026-09 the delivered value
      was the Dec-15 point of Brad's Win10 model curve, -726,000 (2026-09-04); it was then
      re-anchored as a calibration: -1,089,347 (2026-09-08, the combinatorics
      `h_for_plus479k` counterfactual), -1,167,277 (2026-09-10, same target at the refreshed
      seam) and -1,017,277 (2026-09-15, eased 150,000 at the c-suite's request so desktop
      Dec-15 lands at 49,332,443). Flat after Dec-15 (clamp_at_anchor), desktop only - the
      mobile leg is code `u`. Delivered file and value-read meta in
      data-official/2026-09/headwinds/; every re-anchor is dated in the spec's notes. DRAFT.
    spec_glob: "data-official/*/adjustments/headwind.json"
  m:
    name: marketing_lift
    applier: marketing_lift
    description: >
      RETIRED FOR NEW CYCLES as of 2026-08 -- superseded by `p`
      (paid_organic_split). Still registered because July's and August's
      pre-swap `.adj-m.` artifacts must keep loading and reproducing; do not
      remove it. Marketing-attributable DAU lift, subtracted from Fenix Android
      training data before mozaic forecasting (so Prophet learns the
      no-marketing dynamic), then added back to the per-country forecast output.
      Retired because the lift is defined as an increment since an ANCHOR, and
      mobile paid acquisition has no start date -- so the anchor was an
      accounting choice, and the bidirectional overlay absorbed 58% of any
      change to the curve, making a lift comparison useless as a KPI estimate.
      Per-month spec lives in data-official/{YYYY-MM}/marketing/marketing.json
      with a sidecar daily lift parquet from the marketing_lift_model notebooks.
    spec_glob: "data-official/*/marketing/marketing.json"
  p:
    name: paid_organic_split
    applier: paid_organic_split
    description: >
      Mobile organic/paid decomposition -- the mobile replacement for `m`. Paid
      DAU is MEASURED, not modelled: Fenix training rows are multiplied by
      organic_share(date, country) taken from the client-level growth_source
      mirror, so mozaic forecasts organic DAU only. Paid is then stacked back on
      as a LEVEL -- the measured paid for training rows (which keeps them
      byte-identical to raw actuals), and marketing's paid level
      (lift + anchor), allocated by trailing-28d Fenix DAU share, for forecast
      rows. Because the add-back is additive and post-mozaic, paid contributes
      exactly its own value with no Prophet interaction, unlike `m`.
      The share comes from the mirror and the LEVEL from the production query:
      the mirror loses ~2.9% to shredder attrition over 26 months, so using it
      for the level would read as +3.3pp of fake growth. IR is excluded (98.8%
      organic; marketing's curve is ex-IR). Non-Fenix mobile apps are 100%
      organic -- Firefox iOS carries no paid signal at all. Per-month spec lives
      in data-official/{YYYY-MM}/organic/organic.json with a sidecar measured
      split parquet from scripts/build_fenix_organic_split.py.
      MUTUALLY EXCLUSIVE with `m`: main.py raises if both specs claim the same
      applies_to_forecast_start.
    spec_glob: "data-official/*/organic/organic.json"
  l:
    name: launch_at_login_new_users
    applier: per_tile_overlay
    description: >
      Launch at Login for new users desktop DAU tailwind (retitled 2026-09-04 from
      "launch_on_login"; a separate existing-users tailwind is expected later in the
      2026-09 cycle and will be its own code). Measured incremental DAU from the
      launch at login for new users feature (experiment long-term-holdback-2026-growth-desktop, 100%
      rollout 2026-05-08), landing in the modern_windows segment. Per-tile overlay on
      legacy_desktop DAU: the measured historical rise is subtracted from modern_windows
      training rows before mozaic (so Prophet does not extrapolate a one-time step), then
      the capped/flat curve is added back to the per-country forecast, allocated
      proportionally to trailing-28d modern_windows DAU. The ceiling is a per-cycle
      judgement (July 125K, August 200K, September carried 200K unchanged). Spec type
      is the generic desktop_overlay. From 2026-09 the per-cycle spec is
      data-official/{YYYY-MM}/launch_at_login_new_users/launch_at_login_new_users.json;
      cycles through 2026-08 keep the historical launch_on_login/lol.json layout (the
      second glob), with a sidecar daily curve parquet from
      ~/work/launch-on-login/build_lol_tailwind.py.
    spec_glob:
      - "data-official/*/launch_at_login_new_users/launch_at_login_new_users.json"
      - "data-official/*/launch_on_login/lol.json"   # legacy layout, cycles <= 2026-08
  o:
    name: mozillaonline_migration
    applier: per_tile_overlay
    description: >
      MozillaOnline -> canonical Firefox desktop migration tailwind. MozillaOnline
      (Mozilla's China distribution partner) is migrating its desktop users onto
      mainline Firefox; migrating users flip from app_name='Firefox Desktop
      MozillaOnline' to app_name='Firefox Desktop' (the canonical KPI), so they
      newly count -- an additive tailwind, >92% China. Applied bidirectionally
      like launch_on_login `l` on legacy_desktop DAU: the migration DAU is
      subtracted from modern_windows training rows before mozaic (allocated by
      FIXED geo shares from the spec, IR excluded, renormalized over
      training-present countries), then added back to the per-country + ALL
      forecast rows. modern_windows-only by measurement (older-Windows users are
      pinned on Firefox too old to receive the migrating build). Spec type is the
      generic `desktop_overlay`; per-month spec lives in
      data-official/{YYYY-MM}/mozillaonline/mozillaonline.json with a sidecar daily
      migration parquet (Brad Ochocki Szasz's official model, ingested via
      build_official_series.py).
    spec_glob: "data-official/*/mozillaonline/mozillaonline.json"
  t:
    name: mobile_tailwind
    applier: display_layer
    description: >
      August 2026 mobile calibration tailwind. Linear ramp, 0 at the seam
      (2026-08-02, moved with the 2026-08-03 data refresh) to +299,000 at the
      2026-12-15 anchor, mobile only. Adopted at +276,000 and raised to
      +299,000 the same day so published mobile lands within 1,000 DAU of
      July's delivered 17,923,869 -- that last +23,000 is calibration to a
      prior published number, NOT a measurement. SIGN IS
      POSITIVE -- this raises the curve, unlike `h`, whose mobile_dau is
      -27,162. It is a SEPARATE code from `h` on purpose: folding a
      discretionary upward judgement into the headwind line would hide it from
      the attribution ledger.
      Why it exists: the 2026-07-31 `m` -> `p` methodology swap moved mobile
      Dec-15 down 322,714, and a 33-probe parameter search across three
      seasonality regimes established that no exposed non-holiday parameter
      combination recovers it -- the whole probe envelope spans only 63,539,
      because mozaic reconciles top-down and the mobile headline is effectively
      a single Prophet fit on the aggregate organic series. So the remainder is
      carried by this explicit overlay rather than laundered through the model
      config, where it would be invisible.
      Basis: ~47% (+141,637) is the measured excess of an independent
      implementation (scratch/brwells/mobile_organic_aug, 0.77% MAPE / 180-day
      backtest, -1.4% recent bias); the rest is a planning decision. Two
      identified production defects bias the same direction but are unmeasured:
      untreated Farsi-locale shutdown craters in ROW tiles, and 3.5 years of
      backfilled Fenix organic share. See
      data-official/2026-08/tailwind/_index.md.
      Composite-style applier: display-layer, applied to the 28-day MA after
      mozaic, exactly like `h`. Needs no model re-run and has no Prophet
      interaction, so its Dec-15 effect is exactly its anchor.
    spec_glob: "data-official/*/adjustments/tailwind.json"
  j:
    name: japan_bot
    applier: per_tile_overlay
    description: >
      Japan automated desktop traffic, cycle 2026-09. A population of non-organic clients arriving
      in Japan since 2026-06-24 (four-clause behavioural definition: sub-minute sessions, 0 to 10
      URIs, not default browser, profile age under 28 days; 95.1% ESR as an outcome, not an
      input). Measured as raw daily excess over a flat 1,876 +/- 265 DAU/day baseline through the
      2026-09-07 data edge, then an arrival-rate projection convolved with a measured per-cohort
      activity kernel, ramping at the measured 466 DAU/day to a PEAK plateau of 43,813 DAU/day
      (3.99% of Japan) -- the highest single day of excess measured so far, 2026-08-28 -- reached
      2026-09-30 and held flat to 2027-12-31. Re-exported 2026-09-09: the 2026-09-04 build shipped
      MIDDLE (67,101, 6.19% of Japan); the fleet stopped growing in late August (28-day mean 34,919
      at the edge) and Brendan chose PEAK. Alternates at the same edge: LOW 34,919 / MIDDLE 69,839 /
      HIGH 109,926. The plateau is a planning choice, not an estimate: no inflection has been observed. A masking effect, not growth:
      underneath it, ordinary Japanese users are down. Subtracted from modern_windows training
      rows before mozaic and added back after, so Prophet does not extrapolate it on its own;
      allocation is 100% JP, fixed. No double count with `o`: the flagged population is 95.1% ESR
      while the MozillaOnline migration is entirely non-ESR. History is deliberately unsmoothed
      because the daily swing is real contamination. Produced by scratch/brwells/regional-
      story/forecast/deliver.py; evidence page site/forecast.html, DECISIONS D76-D91, D105. Ingested
      2026-09-04 from japan_bot.middle.2026-08-30.csv via /ingest-adjustment; re-ingested 2026-09-09
      from japan_bot.peak.2026-09-07.csv.
    spec_glob: "data-official/*/japan_bot/japan_bot.json"
  i:
    name: india_excess
    applier: per_tile_overlay
    description: >
      India's 2026 desktop DAU above a typical year, cycle 2026-09. The gap between India's
      rebased 28-day KPI DAU curve and the 2022-2025 mean of the same curve by calendar day,
      delivered as a daily series actual x (2026 - typical) / 2026 so weekday structure survives
      subtraction. Onset 2026-05-22 (first 14-day run above every norm year's maximum after the
      Feb 15 - Apr 15 anchor window); zero before onset. Holidays and India-only dips are bridged
      out of every year before measuring (mozaic's calendar lacks Diwali, Dussehra, Sankranti and
      Ambedkar Jayanti), for the ratio only -- the training frame keeps every dip. Already NET of
      `l`: India carries 5.72% of the launch at login for new users lift (11,450 DAU/day at the edge) and that
      is subtracted here; do not net it again. Net 28-day level 52,360/day at the 2026-09-06 edge
      (re-exported 2026-09-09; the 2026-08-29 build read 43,286).
      Shipped path PROPORTIONAL: the excess held at 1.92% of India's typical level, so it follows
      the seasonal calendar -- 50,994 DAU/day on 2026-12-15, held to 2027-12-31. A planning
      choice (Brendan, 2026-09-04: conservative for the time being); four alternatives ship
      alongside (hold 57,155 / linger 41,205 / settle 26,948 / fade 1,916 at Dec-15), and the
      evidence on the producer's page narrows without deciding. The CAUSE IS A HYPOTHESIS (a
      university-calendar change is the leading candidate); report as "India above typical".
      Allocation 100% IN, fixed; modern_windows by measurement (78% of India's DAU). Produced by
      scratch/brwells/regional-story/india_forecast/deliver.py; evidence page
      site/india_forecast.html, DECISIONS D92-D97.
    spec_glob: "data-official/*/india_excess/india_excess.json"
  u:
    name: tou_mobile_headwind
    applier: display_layer
    description: >
      Mobile headwind from the risk attached to the terms-of-use acceptance
      requirement applied in 2025. Linear ramp, 0 at the seam to -27,162 at Dec-15,
      mobile only. Through 2026-08 this was the mobile leg inside
      adjustments/headwind.json (`h`); split out on 2026-09-04 when the Win10 desktop
      headwind became a producer's model curve, because the two are different
      sources and must be sized independently. Display layer: applied to the 28d MA
      after mozaic, exact at Dec-15, no rerun. Spec per cycle at
      data-official/{YYYY-MM}/adjustments/tou_mobile_headwind.json; rationale in
      data-official/{YYYY-MM}/tou_mobile_headwind/_index.md.
    spec_glob: "data-official/*/adjustments/tou_mobile_headwind.json"
  e:
    name: launch_at_login_existing_users
    applier: per_tile_overlay
    description: >
      Launch at Login for EXISTING desktop users DAU tailwind (the new-users half is code l).
      Delivered 2026-09-10 as launch-on-login-dau-forecasts.csv: measured daily incremental DAU
      from the existing-users rollout that began 2026-07-30 (actuals through 2026-09-08, the day
      before the seam), then the producer's forecast to 2026-12-31 with planned rollout steps
      (about 66K from the seam, about 77K on 2026-10-13, about 736K from 2026-10-15; Dec-15 about
      738K, easing to 669K by Dec-31), held flat at the final 28d mean through 2027. The rollout
      steps are planned, not observed. Per-tile overlay on legacy_desktop DAU, modern_windows
      segment: subtracted from training rows before mozaic so Prophet does not extrapolate the
      ramp, added back after. Allocation is LOCALIZED by fixed shares measured once from BigQuery:
      each country's share of trailing-28d (2026-08-12 to 2026-09-08) legacy-desktop DAU on
      Windows 10/11 in an en* locale (US 33.7%, ROW 37.3%, IN 13.6%, ID 5.8%, CA 4.6%), IR
      excluded, because the feature ships to en locales. WITHHELD at ingest (spec carries
      withheld: true): registered and gated on the 2026-09-09 seam but not applied until the key
      is removed; the September rerun that follows ingest must not include it.
    spec_glob: "data-official/*/launch_at_login_existing_users/launch_at_login_existing_users.json"
