# Registry of adjustment codes used in forecast file naming.
#
# Every forecast artifact (parquet/CSV) carries a state marker:
#   .raw.           = no adjustments applied
#   .adj-{codes}.   = one or more adjustments applied; codes are sorted
#                     alphabetically and concatenated (e.g. .adj-h., .adj-ht.)
#
# Adding a new adjustment:
#   1. Add a one-letter code below with name + description + spec_glob.
#   2. Add applier functions to src/mozaic_daily/adjustments.py. Two applier
#      styles exist: post-forecast composite-Series mutators (e.g. `h`,
#      headwinds) and pre+post mozaic per-tile DataFrame mutators (e.g. `m`,
#      marketing_lift). Place new appliers under a clearly-labeled section in
#      adjustments.py.
#   3. Update tests/test_adjustments.py to cover the new code.
#
# Codes must be single lowercase letters, unique. The combined .adj- portion of
# a filename is generated by sorting codes alphabetically (so "h" + "t" -> "ht",
# never "th") — this guarantees one canonical filename per state.

codes:
  h:
    name: headwinds
    description: >
      Linear ramp adjustment over the forecast period, anchored at a target
      date. Captures expected DAU pressure from known headwinds (e.g.
      competitive shifts, regulatory changes). Per-month spec lives in
      data-official/{YYYY-MM}/adjustments/headwind.json.
    spec_glob: "data-official/*/adjustments/headwind.json"
  m:
    name: marketing_lift
    description: >
      Marketing-attributable DAU lift. Subtracted from Fenix Android training
      data before mozaic forecasting (so Prophet learns the no-marketing
      dynamic), then added back to the per-country forecast output (so the
      final answer reflects "campaign continues at modeled levels"). Per-month
      spec lives in data-official/{YYYY-MM}/marketing/marketing.json with a
      sidecar daily lift parquet from the marketing_lift_model notebooks.
    spec_glob: "data-official/*/marketing/marketing.json"
  l:
    name: launch_on_login
    description: >
      Launch-on-login desktop DAU tailwind. Measured incremental DAU from the
      launch-on-login feature (experiment long-term-holdback-2026-growth-desktop,
      100% rollout 2026-05-08), landing in the modern_windows segment. Applied
      bidirectionally like marketing_lift `m` but on legacy_desktop DAU: the
      measured historical rise is subtracted from modern_windows training rows
      before mozaic (so Prophet doesn't extrapolate a one-time step), then the
      capped/flat curve is added back to the per-country forecast. Spec type is
      the generic `desktop_overlay`; per-month spec lives in
      data-official/{YYYY-MM}/launch_on_login/lol.json with a sidecar daily
      curve parquet from ~/work/launch-on-login/build_lol_tailwind.py.
    spec_glob: "data-official/*/launch_on_login/lol.json"
